# nginx in front of gpu-wake-proxy: TLS, the hostname, per-IP limits and the client address.
# One server block per public upstream. Put it in /etc/nginx/conf.d/ and adjust the names.

limit_req_zone $binary_remote_addr zone=demo:1m rate=5r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name demo.example.org;
    ssl_certificate     /etc/letsencrypt/live/demo.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.org/privkey.pem;

    client_max_body_size 10m;

    location / {
        limit_req zone=demo burst=20 nodelay;
        proxy_pass http://127.0.0.1:9101;   # the upstream's "listen"
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # required: wake limits are per client IP
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Let responses and server-sent events stream, and give the host time to wake.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Behind Cloudflare (a tunnel or proxied DNS), restore the visitor's address first:
#   set_real_ip_from 127.0.0.1;            # cloudflared on the same machine
#   real_ip_header CF-Connecting-IP;
