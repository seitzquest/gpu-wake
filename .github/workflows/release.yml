name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
      - run: make test dist VERSION=${{ github.ref_name }}
      - run: >-
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS
          --notes-file CHANGELOG.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
