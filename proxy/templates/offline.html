<!doctype html>
<html lang="en">
<head>
<title>Offline · {{.Title}}</title>
{{template "head" .}}
</head>
<body>
{{template "header" .}}
<main class="center">
  <div class="message">
    {{template "art" (dict "Kind" "offline")}}
    <p class="eyebrow">{{.Title}}</p>
    <h1>Offline for now</h1>
    <p class="status">Please check back later.</p>
  </div>
</main>
</body>
</html>
